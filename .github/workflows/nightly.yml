name: nightly

on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC daily
  workflow_dispatch:

env:
  TEST_ENV: local
  TEST_ORANGEHRM_URL: http://localhost:8081
  TEST_BOOKER_API_URL: https://restful-booker.herokuapp.com
  TEST_ADMIN_USERNAME: ${{ secrets.TEST_ADMIN_USERNAME }}
  TEST_ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD }}

jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0

      - name: Install Python dependencies
        run: uv sync

      - name: Start OrangeHRM (Docker Compose)
        run: docker compose -f infra/docker-compose.orangehrm.yml up -d --wait

      - name: Wait for OrangeHRM readiness
        run: uv run python infra/wait_for_ready.py

      - name: Install Playwright browser (${{ matrix.browser }})
        run: uv run playwright install --with-deps ${{ matrix.browser }}

      - name: Run full regression (${{ matrix.browser }}, sharded with xdist)
        run: uv run pytest --browser ${{ matrix.browser }} -n 4

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.browser }}
          path: test-results/
          retention-days: 7

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-${{ matrix.browser }}
          path: reports/allure-results/
          retention-days: 7

      - name: Stop OrangeHRM
        if: always()
        run: docker compose -f infra/docker-compose.orangehrm.yml down -v

  publish-report:
    needs: regression
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout gh-pages (history source + push target)
        uses: actions/checkout@v7
        with:
          ref: gh-pages

      - name: Set aside previous history (for trend graphs)
        run: |
          mkdir -p /tmp/prev-history
          if [ -d history ]; then cp -r history/* /tmp/prev-history/; fi

      - name: Download Allure results (chromium)
        uses: actions/download-artifact@v8
        with:
          name: allure-results-chromium
          path: allure-results

      - name: Download Allure results (firefox)
        uses: actions/download-artifact@v8
        with:
          name: allure-results-firefox
          path: allure-results

      - name: Download Allure results (webkit)
        uses: actions/download-artifact@v8
        with:
          name: allure-results-webkit
          path: allure-results

      - name: Restore previous history into results
        run: |
          mkdir -p allure-results/history
          cp -r /tmp/prev-history/* allure-results/history/ 2>/dev/null || true

      - name: Set up Java (for the Allure CLI)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Allure CLI
        run: npm install -g allure-commandline

      - name: Generate Allure report
        run: allure generate allure-results --clean -o allure-report

      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report
          publish_branch: gh-pages
